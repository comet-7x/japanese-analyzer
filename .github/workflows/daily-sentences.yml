name: Verify sentence pack
on:
  workflow_dispatch:
    inputs:
      check_upstream:
        description: Also verify the current upstream ZIP against the pinned archive hash
        type: boolean
        default: false
  pull_request:
    paths:
      - 'app/data/daily-sentences.json'
      - 'app/utils/sentencePack.ts'
      - 'scripts/daily-sentence/**'
      - 'tests/sentencePack.test.ts'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run daily:check
      - run: npx tsx tests/sentencePack.test.ts
      - name: Reproduce approved pack from the fingerprinted source snapshot
        run: npm run daily:build
      - name: Check the upstream ZIP (a changed export requires review)
        if: inputs.check_upstream == true
        run: npm run daily:build -- --download
      - run: git diff --exit-code -- app/data/daily-sentences.json
